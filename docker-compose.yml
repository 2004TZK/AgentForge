# ============================================================
# AgentForge 一键启动（生产/演示形态）
# 11 个服务：mysql redis qdrant ollama ollama-init migrate ssl-init ai backend web nginx
# 使用：cp .env.example .env && docker compose up -d --build
# M4：migrate 自动应用数据库迁移；ssl-init 自动生成 HTTPS 证书；
#     全局日志限额 + 各服务资源上限（见下方 x-logging / deploy）
# ============================================================

name: agentforge

# M4 部署加固：全局日志策略（json-file 限额 + 轮转，防止日志占满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 中间件 ----------
  mysql:
    image: mysql:8.0
    container_name: agentforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentforge}
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
    volumes:
      - agentforge-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"          # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    volumes:
      - agentforge-redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"          # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  qdrant:
    image: qdrant/qdrant
    container_name: agentforge-qdrant
    volumes:
      - agentforge-qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"         # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; echo -e 'GET /healthz HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------- Ollama（本地模型：bge-m3 向量 + qwen2.5:7b 对话） ----------
  ollama:
    image: ollama/ollama:latest
    container_name: agentforge-ollama
    volumes:
      # 模型目录直接挂载宿主机（可跨容器共享，便于备份/迁移）
      - ${OLLAMA_DATA_DIR:-D:/ollama}:/root/.ollama
    ports:
      - "11434:11434"                       # 仅开发需要，可注释
    environment:
      # CPU 部署内存紧张，模型常驻避免反复冷加载（qwen2.5:7b 冷加载约 5 分钟）
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4g

  # 一次性预拉模型（模型持久化在共享卷；拉取失败可换镜像源或 nomic-embed-text 兜底）
  ollama-init:
    image: ollama/ollama:latest
    container_name: agentforge-ollama-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull bge-m3 && ollama pull qwen3.5:0.8b && echo 'ollama models ready'"]
    environment:
      # ollama CLI 默认连容器内 localhost，需指向服务容器
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ${OLLAMA_DATA_DIR:-D:/ollama}:/root/.ollama
    depends_on:
      ollama: { condition: service_healthy }
    networks: [agentforge-net]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------- AI 服务（仅内网，不暴露宿主机） ----------
  ai:
    build: ./agentforge-ai
    container_name: agentforge-ai
    environment:
      # 决策 v1.2：全部本地模型（Ollama），本地模型无需 API Key
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_LOCAL: ${LLM_LOCAL:-true}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:0.8b}
      LLM_THINK: ${LLM_THINK:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      UPLOAD_DIR: /data/uploads
    volumes:
      - agentforge-uploads:/data/uploads
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  # ---------- 数据库迁移（一次性：按文件名顺序应用 upgrade/*.sql，幂等） ----------
  migrate:
    image: mysql:8.0
    container_name: agentforge-migrate
    entrypoint: ["/bin/sh", "/upgrade/migrate.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentforge}
    volumes:
      - ./docker/mysql/upgrade:/upgrade:ro
    depends_on:
      mysql: { condition: service_healthy }
    networks: [agentforge-net]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------- 后端（仅内网，不暴露宿主机） ----------
  backend:
    build: ./agentforge-backend
    container_name: agentforge-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agentforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-agentforge}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AGENTFORGE_JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-0123456789abcdef-0123456789}
      AGENTFORGE_JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      AGENTFORGE_AI_BASE_URL: http://ai:8000
      AGENTFORGE_AI_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      AGENTFORGE_AI_CONNECT_TIMEOUT_MS: ${AGENTFORGE_AI_CONNECT_TIMEOUT_MS:-5000}
      AGENTFORGE_AI_READ_TIMEOUT_MS: ${AGENTFORGE_AI_READ_TIMEOUT_MS:-600000}
      AGENTFORGE_UPLOAD_DIR: /data/uploads
    volumes:
      - agentforge-uploads:/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536m

  # ---------- 前端静态资源 ----------
  web:
    build: ./agentforge-web
    container_name: agentforge-web
    depends_on:
      backend: { condition: service_healthy }
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- HTTPS 证书（一次性：无证书时自动生成自签，幂等） ----------
  ssl-init:
    image: alpine:3.20
    container_name: agentforge-ssl-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache openssl >/dev/null 2>&1 && /ssl/gen-cert.sh"]
    environment:
      CERT_DIR: /certs
    volumes:
      - ./docker/nginx/certs:/certs
      - ./docker/nginx/ssl:/ssl:ro
    networks: [agentforge-net]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- 边缘网关（唯一对外入口，HTTP + HTTPS） ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: agentforge-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      ssl-init: { condition: service_completed_successfully }
      web: { condition: service_started }
      backend: { condition: service_started }
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  agentforge-net:
    name: agentforge-net
    driver: bridge

volumes:
  agentforge-mysql-data:
  agentforge-redis-data:
  agentforge-qdrant-data:
  agentforge-uploads:          # 共享文件卷：后端写入、AI 读取（RAG 解析）
