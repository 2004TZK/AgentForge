# ============================================================
# AgentForge 一键启动（生产/演示形态）
# 10 个服务：mysql redis qdrant migrate ssl-init ai sandbox backend web nginx
# 使用：cp .env.example .env && docker compose up -d --build
# M4：migrate 自动应用数据库迁移；ssl-init 自动生成 HTTPS 证书；
#     全局日志限额 + 各服务资源上限（见下方 x-logging / deploy）
# M5：sandbox 沙箱执行器（无外网）支撑自定义代码工具
# 决策 v1.4：LLM 与 Embedding 全部走千问云端 API，无本地模型/Ollama 容器
# ============================================================

name: agentforge

# M4 部署加固：全局日志策略（json-file 限额 + 轮转，防止日志占满磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 中间件 ----------
  mysql:
    image: mysql:8.0
    container_name: agentforge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentforge}
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
    volumes:
      - agentforge-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"          # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    container_name: agentforge-redis
    volumes:
      - agentforge-redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"          # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  qdrant:
    image: qdrant/qdrant
    container_name: agentforge-qdrant
    volumes:
      - agentforge-qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"         # 仅开发需要，可注释
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; echo -e 'GET /healthz HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  # ---------- AI 服务（仅内网，不暴露宿主机） ----------
  ai:
    build: ./agentforge-ai
    container_name: agentforge-ai
    environment:
      # 决策 v1.4：千问云端 API（OpenAI 兼容），需 LLM_API_KEY
      LLM_API_KEY: ${LLM_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}           # 可选：GitHub 工具 API Token（提升限流额度）
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_LOCAL: ${LLM_LOCAL:-false}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-plus}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      LLM_REMOTE_DISABLE_THINKING: ${LLM_REMOTE_DISABLE_THINKING:-true}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      UPLOAD_DIR: /data/uploads
      # M5 自定义工具：代码工具经 sandbox 沙箱执行（无外网）；HTTP 工具 SSRF 防护默认开启
      SANDBOX_BASE_URL: http://sandbox:8700
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-dev-sandbox-token}
      HTTP_TOOL_SSRF_ENABLED: ${HTTP_TOOL_SSRF_ENABLED:-true}
    volumes:
      - agentforge-uploads:/data/uploads
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      sandbox: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  # ---------- 沙箱执行器（M5：受限执行用户代码，无外网） ----------
  # 网络：加入 agentforge-net（AI 服务可访问）；entrypoint 以 iptables 拒绝主动出站新连接
  # （仅放行已建立连接的回复），实现"无外网"语义；子进程降权 nobody + 资源限制
  sandbox:
    build: ./docker/sandbox
    container_name: agentforge-sandbox
    environment:
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-dev-sandbox-token}
    cap_add:
      - NET_ADMIN            # iptables 出站拦截需要
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ---------- 数据库迁移（一次性：按文件名顺序应用 upgrade/*.sql，幂等） ----------
  migrate:
    image: mysql:8.0
    container_name: agentforge-migrate
    entrypoint: ["/bin/sh", "/upgrade/migrate.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-agentforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentforge}
    volumes:
      - ./docker/mysql/upgrade:/upgrade:ro
    depends_on:
      mysql: { condition: service_healthy }
    networks: [agentforge-net]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------- 后端（仅内网，不暴露宿主机） ----------
  backend:
    build: ./agentforge-backend
    container_name: agentforge-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agentforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-agentforge}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AGENTFORGE_JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-0123456789abcdef-0123456789}
      AGENTFORGE_JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      # M5 自定义工具密钥 AES-GCM 加密（生产必须覆盖，≥32 字节）
      AGENTFORGE_TOOL_SECRET: ${TOOL_SECRET:-dev-only-tool-secret-0123456789abcdef-0123456789}
      AGENTFORGE_AI_BASE_URL: http://ai:8000
      AGENTFORGE_AI_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      AGENTFORGE_AI_CONNECT_TIMEOUT_MS: ${AGENTFORGE_AI_CONNECT_TIMEOUT_MS:-5000}
      AGENTFORGE_AI_READ_TIMEOUT_MS: ${AGENTFORGE_AI_READ_TIMEOUT_MS:-600000}
      AGENTFORGE_UPLOAD_DIR: /data/uploads
      # AI 服务入库进度回调后端内部接口（容器网络内地址）
      AGENTFORGE_UPLOAD_PROGRESS_BASE_URL: http://backend:8080/api
    volumes:
      - agentforge-uploads:/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536m

  # ---------- 前端静态资源 ----------
  web:
    build: ./agentforge-web
    container_name: agentforge-web
    depends_on:
      backend: { condition: service_healthy }
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- HTTPS 证书（一次性：无证书时自动生成自签，幂等） ----------
  ssl-init:
    image: alpine:3.20
    container_name: agentforge-ssl-init
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache openssl >/dev/null 2>&1 && /ssl/gen-cert.sh"]
    environment:
      CERT_DIR: /certs
    volumes:
      - ./docker/nginx/certs:/certs
      - ./docker/nginx/ssl:/ssl:ro
    networks: [agentforge-net]
    restart: "no"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- 边缘网关（唯一对外入口，HTTP + HTTPS） ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: agentforge-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      ssl-init: { condition: service_completed_successfully }
      web: { condition: service_started }
      backend: { condition: service_started }
    networks: [agentforge-net]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  agentforge-net:
    name: agentforge-net
    driver: bridge

volumes:
  agentforge-mysql-data:
  agentforge-redis-data:
  agentforge-qdrant-data:
  agentforge-uploads:          # 共享文件卷：后端写入、AI 读取（RAG 解析）
