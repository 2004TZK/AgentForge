# ============================================================
# AgentForge 边缘网关（唯一对外入口）
#   /        → web（SPA 静态资源）
#   /api/*   → backend:8080（Bearer JWT，后端鉴权）
#   /ai/*    → ai:8000（内网，X-Internal-Token，仅限内部调用）
# ============================================================

server {
    listen 80;
    server_name _;

    # 静态资源：SPA 入口 + 缓存控制
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 API（后端 context-path=/api，原样透传）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式预留（Phase 3+）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # AI 服务（去掉 /ai 前缀转发；AI 端口不对宿主机开放，仅内网可达）
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
