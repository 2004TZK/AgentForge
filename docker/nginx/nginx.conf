# ============================================================
# AgentForge 边缘网关（唯一对外入口）
#   /        → web（SPA 静态资源）
#   /api/*   → backend:8080（Bearer JWT，后端鉴权）
#   /ai/*    → ai:8000（内网，X-Internal-Token，仅限内部调用）
# M4 HTTPS：443 端口自动启用（证书由 ssl-init 容器自动生成/复用，
#   挂载 docker/nginx/certs，见 docker/nginx/ssl/gen-cert.sh）。
# ============================================================

# HTTP（保留：兼容直连调试 / 无证书场景）
server {
    listen 80;
    server_name _;
    # Docker 嵌入式 DNS：upstream 用变量 + resolver 按请求动态解析，
    # 避免容器重建（IP 变化）后 nginx 仍连接旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态资源：SPA 入口 + 缓存控制
    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 后端 API（后端 context-path=/api，原样透传）
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式预留
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # AI 服务（去掉 /ai 前缀转发；AI 端口不对宿主机开放，仅内网可达）
    location /ai/ {
        set $ai_upstream http://ai:8000;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# HTTPS（M4：证书由 ssl-init 自动生成，见 compose）
server {
    listen 443 ssl;
    server_name _;
    # 同上：动态解析 upstream，容器重建后无需重启网关
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/certs/agentforge.crt;
    ssl_certificate_key /etc/nginx/certs/agentforge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /ai/ {
        set $ai_upstream http://ai:8000;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
