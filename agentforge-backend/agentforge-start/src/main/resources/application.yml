# ============================================================
# AgentForge 后端配置
# 约定：禁止硬编码，环境相关配置全部支持环境变量覆盖（${VAR:默认值}）
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api          # 统一前缀，Nginx/Vite 原样透传

spring:
  application:
    name: agentforge-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agentforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:agentforge}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-app}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  servlet:
    multipart:
      # 数据库文件常大于文档，上限提升至 50MB（与 agentforge.upload.max-size 保持一致）
      max-file-size: ${AGENTFORGE_UPLOAD_MAX_SIZE:50MB}
      max-request-size: ${AGENTFORGE_UPLOAD_MAX_SIZE:50MB}

  mvc:
    async:
      # SSE 流式：CPU 本地推理慢（qwen2.5:7b 生成可达数分钟），async 请求放宽到 10 分钟
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT_MS:600000}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除（设计 3.1 节：全部业务表 deleted 字段）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# ---------- 应用自定义配置 ----------
agentforge:
  jwt:
    # 开发默认值仅用于本地；生产必须通过环境变量覆盖（≥32 字节）
    secret: ${AGENTFORGE_JWT_SECRET:dev-only-jwt-secret-0123456789abcdef-0123456789}
    expire-hours: ${AGENTFORGE_JWT_EXPIRE_HOURS:24}
  ai:
    base-url: ${AGENTFORGE_AI_BASE_URL:http://localhost:8000}
    internal-token: ${AGENTFORGE_AI_INTERNAL_TOKEN:dev-internal-token}
    connect-timeout-ms: ${AGENTFORGE_AI_CONNECT_TIMEOUT_MS:5000}
    # CPU 本地推理较慢（qwen2.5:7b 冷加载约 5 分钟），读取放宽到 10 分钟
    read-timeout-ms: ${AGENTFORGE_AI_READ_TIMEOUT_MS:600000}
  upload:
    dir: ${AGENTFORGE_UPLOAD_DIR:./data/uploads}
    # 单文件大小上限（字节），默认 50MB；与 spring.servlet.multipart 上限保持一致
    max-size: ${AGENTFORGE_UPLOAD_MAX_SIZE_BYTES:52428800}
    # AI 服务入库进度回调的基础地址（内部接口 /file/{id}/progress）
    # 容器内为 http://backend:8080/api（compose 已注入），本机开发默认 localhost
    progress-base-url: ${AGENTFORGE_UPLOAD_PROGRESS_BASE_URL:http://localhost:8080/api}
    # 手动切片参数上限（与 AI 服务 manual_max_chunk_rows/tokens 保持一致）
    manual-max-chunk-rows: ${AGENTFORGE_UPLOAD_MANUAL_MAX_CHUNK_ROWS:500}
    manual-max-chunk-tokens: ${AGENTFORGE_UPLOAD_MANUAL_MAX_CHUNK_TOKENS:2000}

# ---------- API 文档 ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------- 健康检查 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.agentforge: info
