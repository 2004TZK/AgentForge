# ============================================================
# AgentForge 后端配置
# 约定：禁止硬编码，环境相关配置全部支持环境变量覆盖（${VAR:默认值}）
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api          # 统一前缀，Nginx/Vite 原样透传

spring:
  application:
    name: agentforge-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/agentforge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:agentforge}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-app}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除（设计 3.1 节：全部业务表 deleted 字段）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# ---------- 应用自定义配置 ----------
agentforge:
  jwt:
    # 开发默认值仅用于本地；生产必须通过环境变量覆盖（≥32 字节）
    secret: ${AGENTFORGE_JWT_SECRET:dev-only-jwt-secret-0123456789abcdef-0123456789}
    expire-hours: ${AGENTFORGE_JWT_EXPIRE_HOURS:24}
  ai:
    base-url: ${AGENTFORGE_AI_BASE_URL:http://localhost:8000}
    internal-token: ${AGENTFORGE_AI_INTERNAL_TOKEN:dev-internal-token}
    connect-timeout-ms: ${AGENTFORGE_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AGENTFORGE_AI_READ_TIMEOUT_MS:60000}
  upload:
    dir: ${AGENTFORGE_UPLOAD_DIR:./data/uploads}

# ---------- API 文档 ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------- 健康检查 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.agentforge: info
