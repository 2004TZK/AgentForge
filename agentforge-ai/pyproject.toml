[project]
name = "agentforge-ai"
version = "1.0.0"
description = "AgentForge AI Service：对话 / RAG / 工具调用"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "pypdf>=5.1",
    "python-multipart>=0.0.17",
    "python-docx>=1.1.2",
    "langgraph>=0.2",
    "openai>=1.55",
    "langchain>=0.3",
    # ── 星盘分析工具 (M1) ──
    "pyswisseph>=2.10.3.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "e2e_*.py"]
