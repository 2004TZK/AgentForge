# 前端容器内静态服务：SPA 路由回退（边缘网关由根目录 docker/nginx/nginx.conf 负责）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 禁止缓存：哈希资源更新后旧入口页会引用已不存在的文件名（白屏），
    # 入口必须每次重新校验，确保拿到最新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
